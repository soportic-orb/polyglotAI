name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sodium, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Tests
        run: composer test

      - name: Estándares de código
        run: composer phpcs

      - name: Análisis estático
        run: composer phpstan

  integration:
    runs-on: ubuntu-latest
    name: Integración (WordPress ${{ matrix.wp }})
    strategy:
      fail-fast: false
      matrix:
        wp: [ '6.6.2' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, sodium, intl, mysqli
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Instalar WordPress y su biblioteca de tests
        run: composer test:install -- wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Tests de integración
        run: composer test:integration

  assets:
    runs-on: ubuntu-latest
    name: Recursos

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Estándares de JavaScript
        run: npm run lint:js

      - name: Estándares de estilos
        run: npm run lint:css

      - name: Tests de JavaScript
        run: npm run test:js

      - name: Compilar
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    name: Extremo a extremo

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pgai_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, sodium, intl, mysqli
          coverage: none

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: |
          composer install --no-interaction --no-progress
          npm ci

      # El editor y el selector se sirven desde assets/build, que no se versiona.
      - name: Compilar recursos
        run: npm run build

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Levantar el sitio
        run: bash tests/e2e/install.sh

      - name: Pruebas de extremo a extremo
        run: npm run test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
