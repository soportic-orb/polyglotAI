name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sodium, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Tests
        run: composer test

      - name: Estándares de código
        run: composer phpcs

      - name: Análisis estático
        run: composer phpstan

  integration:
    runs-on: ubuntu-latest
    name: Integración (WordPress ${{ matrix.wp }})
    strategy:
      fail-fast: false
      matrix:
        wp: [ '6.6.2' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, sodium, intl, mysqli
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress

      - name: Instalar WordPress y su biblioteca de tests
        run: composer test:install -- wordpress_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Tests de integración
        run: composer test:integration
